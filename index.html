<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05060d" />
  <meta name="description" content="The Filter AI. A training game where you play the guardrail on an AI assistant. Catch prompt injections, jailbreaks, and encoded payloads, then build, break and defend your own local AI agent. Covers the OWASP LLM Top 10 for Applications 2025." />
  <title>The Filter AI · AI Prompt Injection Defense Training</title>
  <link rel="icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="lab/lab.css" />
</head>
<body>
  <!-- The night sky and moon, drawn by stars.js. Decorative only. -->
  <canvas id="bgCanvas" aria-hidden="true"></canvas>
  <a class="skip" href="#screen">Skip to content</a>

  <!-- One header for every section. The engine fills the Pro badge, the
       nav state and the XP figures. -->
  <header class="topbar">
    <div class="topbar-in">
      <a class="tb-brand" href="#/" aria-label="The Filter AI, home">
        <img src="logo.png" alt="" width="320" height="320" decoding="async" />
        <span class="wordmark">The Filter <span class="ai">AI</span></span>
        <span class="pro-badge" id="proBadge" hidden>Pro</span>
        <span class="free-badge" id="freeBadge" hidden>Free</span>
      </a>
      <div class="tb-stats" aria-label="Your score">
        <span class="stat-xp" id="hudXp">0 XP</span>
        <span class="stat-streak" id="hudStreak">🔥 0</span>
      </div>
      <nav class="tb-nav" id="topnav" aria-label="Sections">
        <a href="#/hub" data-nav="hub" id="navHub">Hub</a>
        <a href="#/course" data-nav="course">Course</a>
        <a href="#/range" data-nav="range" id="navRange">Practice Range</a>
        <a href="#/lab" data-nav="lab" id="navLab">Lab</a>
        <a href="#/unlock" class="tb-cta" id="navBuy" hidden>Get full access</a>
      </nav>
    </div>
  </header>

  <!--
    Config lives on #app as data-* attributes (kept off inline <script> so the
    page stays CSP-compatible). data-price is the one place the price text
    lives for the game screens.
  -->
  <div class="app" id="app"
       data-free-only="true"
       data-gumroad-url="https://gumroad.com/checkout?product=jxdjnw"
       data-price="$39.90"
       data-full-url="https://private.hamcodes.com">

    <!-- Desktop-only unit map, course view only -->
    <aside class="levelmap" id="levelmap" aria-hidden="true"></aside>

    <main class="stage" id="main">
      <div class="course-hud" id="courseHud" hidden>
        <div class="row"><span id="hudLevel">Unit 1 / 7</span><span id="hudEx"></span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div id="screen" tabindex="-1"></div>
    </main>
  </div>

  <!-- Load order matters: content, range and the lab provide globals the
       engine reads; lab.js waits for the engine's window.FILTER API. -->
  <script src="stars.js"></script>
  <script src="content.js"></script>
  <script src="range.js"></script>
  <script src="lab/lab-config.js"></script>
  <script src="certificate.js"></script>
  <script src="engine.js"></script>
</body>
</html>
